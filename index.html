<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Larisa Kampe — Portfolio</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
    <meta
      name="description"
      content="Creative Web Developer and Designer dedicated to bridging the gap between aesthetics and functionality."
    />

    <!-- Fonts -->
     
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Caveat:wght@600;700&family=DM+Sans:wght@400;500&family=Cormorant+Garamond:wght@400;500&family=Space+Grotesk:wght@700&family=IBM+Plex+Sans:wght@400&family=IBM+Plex+Mono:wght@500&family=Nunito+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Case-study type-specimen fonts (Space Grotesk, IBM Plex Sans/Mono,
         DM Sans, Cormorant Garamond, Nunito Sans) are loaded above so the
         "Ab" samples in each project's font-system section render in the
         real typeface, not a fallback. -->

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ═══════════ SIDEBAR ═══════════════════════ -->
    <!--  Built dynamically by main.js              -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- ═══════════ MAIN CONTENT ════════════════ -->
    <!--  Pages built dynamically by main.js       -->
    <main class="main" id="main"></main>

    <!-- ═══════════ SCROLL TO TOP ════════════════ -->
    <button class="scroll-top" id="scroll-top" aria-label="Scroll to top">
      <svg
        viewBox="0 0 24 24"
        width="14"
        height="14"
        stroke="currentColor"
        fill="none"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="18 15 12 9 6 15" />
      </svg>
    </button>

    <!-- ═══════════ DATA ══════════════════════════ -->
    <script src="data.js"></script>

    <!-- ═══════════ MAIN SCRIPT ══════════════════ -->
    <script src="main.js"></script>
  </body>
</html>
